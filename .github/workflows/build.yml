    - name: Change Kernel Name
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        # Format timestamp untuk kernel version
        KERNEL_TIMESTAMP=$(date +"%Y%m%d.%H%M")
        BUILD_DATE=$(date +"%a %b %d %H:%M:%S %Z %Y")

        # SET BUILD USER DAN HOST LANGSUNG KE MAKE FILE
         echo "Setting build user: FUCK-YOU"
         echo "Setting build host: NETANYAHU"

        # Simpan ke environment untuk build step berikutnya
         echo "KBUILD_BUILD_TIMESTAMP=$BUILD_DATE" >> $GITHUB_ENV
         echo "KBUILD_BUILD_USER=FUCK-YOU" >> $GITHUB_ENV
         echo "KBUILD_BUILD_HOST=NETANYAHU" >> $GITHUB_ENV

         echo "Build timestamp: $BUILD_DATE"
         echo "Kernel timestamp: $KERNEL_TIMESTAMP"

        # Wild to Kernel Version (replace last instance only)
        if [[ "${{ inputs.kernel_version }}" == "5."* ]] || [[ "${{ inputs.kernel_version }}" == "6.1" ]]; then
        case ${{ matrix.build_type }} in
        TheWildJames)
          perl -i -0777 -pe 's/(.*)echo "\$res"/$1echo "\$res-🟢-Wild-Exclusive-'"$KERNEL_TIMESTAMP"'"/s' ./common/scripts/setlocalversion
         ;;
         MarionKernel)
          perl -i -0777 -pe 's/(.*)echo "\$res"/$1echo "\$res-Wild-MarionKernel-'"$KERNEL_TIMESTAMP"'"/s' ./common/scripts/setlocalversion
         ;;
         Hakan)
         perl -i -0777 -pe 's/(.*)echo "\$res"/$1echo "\$res-Wild-Hakan-'"$KERNEL_TIMESTAMP"'"/s' ./common/scripts/setlocalversion
         ;;
         *)
         perl -i -0777 -pe 's/(.*)echo "\$res"/$1echo "\$res-FUCK-YOU-TRUMP"/s' ./common/scripts/setlocalversion
         ;;
         esac
         else
         # Untuk kernel 6.6/6.12 - FIXED VERSION
         perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}-Wild-'"$KERNEL_TIMESTAMP"'\$\{scm_version\}"/s' ./common/scripts/setlocalversion
         fi

         # MENGUPDATE BUILD USER/HOST LANGSUNG DI MAKEFILE
         if [ -f "./common/Makefile" ]; then
         # Update KBUILD_BUILD_USER dan KBUILD_BUILD_HOST di Makefile
         sed -i "s/^KBUILD_BUILD_USER.*/KBUILD_BUILD_USER := FUCK-YOU/" ./common/Makefile
         sed -i "s/^KBUILD_BUILD_HOST.*/KBUILD_BUILD_HOST := NETANYAHU/" ./common/Makefile
         sed -i "s/^KBUILD_BUILD_TIMESTAMP.*/KBUILD_BUILD_TIMESTAMP := $BUILD_DATE/" ./common/Makefile
  
         # Jika tidak ada, tambahkan
         if ! grep -q "^KBUILD_BUILD_USER" ./common/Makefile; then
         echo "" >> ./common/Makefile
         echo "KBUILD_BUILD_USER := FUCK-YOU" >> ./common/Makefile
         fi
         if ! grep -q "^KBUILD_BUILD_HOST" ./common/Makefile; then
         echo "KBUILD_BUILD_HOST := NETANYAHU" >> ./common/Makefile
         fi
         if ! grep -q "^KBUILD_BUILD_TIMESTAMP" ./common/Makefile; then
         echo "KBUILD_BUILD_TIMESTAMP := $BUILD_DATE" >> ./common/Makefile
         fi
         fi

         # Juga update di init/version.c jika ada
         if [ -f "./common/init/version.c" ]; then
         sed -i "s/\"build-user\"/\"FUCK-YOU\"/g" ./common/init/version.c
         sed -i "s/\"build-host\"/\"NETANYAHU\"/g" ./common/init/version.c
         fi

         if [ -f "build/build.sh" ]; then
          # Remove Dirty Flag
          sed -i 's/-dirty//' ./common/scripts/setlocalversion
          else
         # Remove Dirty Flag
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          sed -i 's/-dirty//' ./common/scripts/setlocalversion
         # Remove Abi Exports and Error
          rm -rf ./common/android/abi_gki_protected_exports_*
          perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' ./common/BUILD.bazel
         fi

         cd $KERNEL_ROOT/common
         git config --global user.name "github-actions[bot]"
         git config --global user.email "github-actions[bot]@users.noreply.github.com"
         git add .
         git commit -m "Wild: Build $BUILD_DATE"

    - name: Remove ALL Android Version Strings
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
         echo "=== REMOVING ALL ANDROID VERSION STRINGS ==="
    
         # 1. Hapus dari Makefile - termasuk android14 dan android14-11
         if [[ -f "common/Makefile" ]]; then
          # Hapus semua variasi android14
          sed -i 's/android14-11//g' common/Makefile
          sed -i 's/android14//g' common/Makefile
      
          # Juga hapus dari EXTRAVERSION jika ada
          sed -i 's/EXTRAVERSION =.*android.*//g' common/Makefile
          sed -i '/^EXTRAVERSION = -android14/d' common/Makefile
          sed -i '/^EXTRAVERSION = -android14-11/d' common/Makefile
      
          echo "✓ Cleaned Android strings from Makefile"
         fi
    
         # 2. Hapus dari version.c
         if [[ -f "common/init/version.c" ]]; then
          sed -i 's/"android14-11"//g' common/init/version.c
          sed -i 's/"android14"//g' common/init/version.c
          sed -i 's/android14-11//g' common/init/version.c
          sed -i 's/android14//g' common/init/version.c
          echo "✓ Cleaned Android strings from version.c"
         fi
    
         # 3. Hapus dari setlocalversion script
         if [[ -f "common/scripts/setlocalversion" ]]; then
          sed -i 's/android14-11//g' common/scripts/setlocalversion
          sed -i 's/android14//g' common/scripts/setlocalversion
          echo "✓ Cleaned Android strings from setlocalversion"
         fi
    
         # 4. Hapus dari BUILD.bazel
         if [[ -f "common/BUILD.bazel" ]]; then
          sed -i 's/android14-11//g' common/BUILD.bazel
          sed -i 's/android14//g' common/BUILD.bazel
          echo "✓ Cleaned Android strings from BUILD.bazel"
         fi
    
          # 5. Hapus dari semua file C dan header
          echo "=== Removing Android strings from all source files ==="
          find common -type f \( -name "*.c" -o -name "*.h" -o -name "*.S" \) \
          -exec grep -l "android14" {} \; 2>/dev/null | \
          while read file; do
          sed -i 's/android14-11//g' "$file"
          sed -i 's/android14//g' "$file"
          echo "  Cleaned: $file"
         done
    
          # 6. Hapus dari semua Makefile dan Kbuild
          find common -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) \
          -exec grep -l "android14" {} \; 2>/dev/null | \
          while read file; do
          sed -i 's/android14-11//g' "$file"
          sed -i 's/android14//g' "$file"
          echo "  Cleaned: $file"
         done
    
         # 7. VERIFIKASI: Cek apakah masih ada yang tersisa
         echo "=== Final verification ==="
         REMAINING=$(find common -type f -exec grep -l "android14" {} \; 2>/dev/null | wc -l)
    
         if [[ "$REMAINING" -gt 0 ]]; then
          echo "⚠️  WARNING: Masih ada $REMAINING file yang mengandung 'android14':"
          find common -type f -exec grep -l "android14" {} \; 2>/dev/null | head -20
          echo "Mencoba pembersihan lebih agresif..."
      
         # Pembersihan agresif dengan sed pattern matching
          find common -type f \( -name "*.c" -o -name "*.h" -o -name "*.S" -o -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) \
          -exec sed -i 's/[Aa]ndroid[[:space:]]*14[-]*11*//g' {} \;
          find common -type f \( -name "*.c" -o -name "*.h" -o -name "*.S" -o -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) \
          -exec sed -i 's/[Aa]ndroid14[-]*11*//g' {} \;
          else
          echo "✅ SUCCESS: Semua string 'android14' telah dihapus!"
         fi
    
          # 8. Tampilkan preview versi kernel nanti
          echo ""
          echo "=== Expected kernel version format ==="
          echo "Sebelum: 6.1.124-android14-11-FUCK-YOU-TRUMP-FUCK-YOU@NETANYAHU"
          echo "Sesudah: 6.1.124-FUCK-YOU-TRUMP-FUCK-YOU@NETANYAHU"

    - name: Set Build Environment Variables
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
         # Export environment variables untuk kernel build
         # Variabel ini akan digunakan oleh build system kernel
         export KBUILD_BUILD_TIMESTAMP="${{ env.KBUILD_BUILD_TIMESTAMP || '$(date +"%a %b %d %H:%M:%S %Z %Y")' }}"
