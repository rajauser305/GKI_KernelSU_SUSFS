      run: |
        # Security enhancements
        echo "CONFIG_SECURITY=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_SECURITY_SELINUX=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_SECURITY_SELINUX_DISABLE=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_SECURITY_SELINUX_AVC_STATS=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_SECURITY_SELINUX_CHECKREQPROT_VALUE=0" >> "${{ env.DEFCONFIG }}"

        # Kernel hardening
        echo "CONFIG_STRICT_DEVMEM=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_DEBUG_CREDENTIALS=y" >> "${{ env.DEFCONFIG }}"

    - name: Add Sound and Audio Optimizations
      if: true
      working-directory: ${{ env.KERNEL_ROOT }}
      run: 
       # Audio optimizations
       echo "CONFIG_SND=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_SND_HWDEP=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_SND_RAWMIDI=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_SND_COMPRESS_OFFLOAD=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_SND_JACK=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_SND_HDA_PREALLOC_SIZE=64" >> "${{ env.DEFCONFIG }}"

    - name: Add BBG
      if: false
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        curl -LSs https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
        echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

    - name: Apply Module Check Bypass
      if: ${{ matrix.build_type == 'Bypass' || matrix.build_type == 'Hakan' }}
      run: |
        if [[ "${{ inputs.kernel_version }}" == "6.1" || "${{ inputs.kernel_version }}" == "6.6" || "${{ inputs.kernel_version }}" == "6.12" ]]; then
          TARGET_FILE="$KERNEL_ROOT/common/kernel/module/version.c"
        else
          TARGET_FILE="$KERNEL_ROOT/common/kernel/module.c"
        fi

        echo "Applying bypass to $TARGET_FILE"
        sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

        # Verify the bypass
        if grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
          echo "SUCCESS: Module check bypass verified in $TARGET_FILE"
        else
          echo "FAILED: Module check bypass not found in $TARGET_FILE"
          grep -A 5 "bad_version:" "$TARGET_FILE" || true
          exit 1
        fi

    - name: Fix WiFi and Bluetooth on Samsung 6.6 GKI devices
      if: ${{ ( inputs.kernel_version == '6.6' ) }}
