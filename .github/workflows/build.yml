        # Debugging tools (opsional, untuk developer)
        echo "CONFIG_PROFILING=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_OPROFILE=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_PERF_EVENTS=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_DEBUG_FS=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_FTRACE=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_FUNCTION_TRACER=y" >> "${{ env.DEFCONFIG }}"

    - name: Add Security Enhancements
      if: true
