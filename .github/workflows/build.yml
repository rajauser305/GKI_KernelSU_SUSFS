        # QoS and traffic control
        echo "CONFIG_NET_CLS=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_NET_CLS_ACT=y" >> "${{ env.DEFCONFIG }}"

    - name: Add Display and Touch optimizations
      if: true
