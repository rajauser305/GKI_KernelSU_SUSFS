        # Display optimizations
        echo "CONFIG_FRAMEBUFFER_CONSOLE=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_FRAMEBUFFER_CONSOLE_ROTATION=y" >> "${{ env.DEFCONFIG }}"

        # Touchscreen optimizations
        echo "CONFIG_TOUCHSCREEN_PREVENT_SLEEP=y" >> "${{ env.DEFCONFIG }}"

    - name: Add Battery Saving Features
      if: true
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        # Battery saving features
        echo "CONFIG_POWERSUSPEND=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_POWERSUSPEND_DEBUG=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_POWERSUSPEND_DEFAULT_MODE=3" >> "${{ env.DEFCONFIG }}"

