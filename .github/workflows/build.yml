       echo "CONFIG_CPU_FREQ_GOV_BLU_SCHEDUTIL=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_ELECTROUTIL=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_HELIX_SCHEDUTIL=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_PWRUTILX=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_ALUCARDSCHED=y" >> "${{ env.DEFCONFIG }}"
    
       # Enable userspace governor untuk kontrol manual
       echo "CONFIG_CPU_FREQ_GOV_USERSPACE=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_ONDEMAND=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y" >> "${{ env.DEFCONFIG }}"
    
       # Enable CPU Boost
       echo "CONFIG_CPU_BOOST=y" >> "${{ env.DEFCONFIG }}"
    
    - name: Add Kernel Samepage Merging (KSM)
      if: true
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
       # KSM untuk optimasi memori (menggabungkan halaman memori yang identik)
       echo "CONFIG_KSM=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_UKSM=y" >> "${{ env.DEFCONFIG }}"
    
    - name: Add ZRAM and ZSWAP optimizations
      if: true
