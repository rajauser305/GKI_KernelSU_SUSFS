         echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
         echo "KBUILD_BUILD_USER=FUCK-YOU"
         echo "KBUILD_BUILD_HOST=NETANYAHU"
    
         # Export untuk step berikutnya (jika belum)
