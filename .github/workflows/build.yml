        echo "CONFIG_WAKELOCK_BLOCKER=y" >> "${{ env.DEFCONFIG }}"

    - name: Apply Performance Governor Patches
      if: true
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        # Download dan apply patch untuk governors tambahan
        if [[ ! -d "$KERNEL_PATCHES/performance" ]]; then
          mkdir -p "$KERNEL_PATCHES/performance"
        fi

        # Blueschedutil Governor
        if [[ ! -f "$KERNEL_PATCHES/performance/blu_schedutil.patch" ]]; then
          curl -L -o "$KERNEL_PATCHES/performance/blu_schedutil.patch" \
            "https://raw.githubusercontent.com/engstk/android_kernel_oneplus_sm8350/lineage-21/drivers/cpufreq/blu_schedutil.c"
        fi

        # Electroutil Governor
        if [[ ! -f "$KERNEL_PATCHES/performance/electroutil.patch" ]]; then
          curl -L -o "$KERNEL_PATCHES/performance/electroutil.patch" \
            "https://raw.githubusercontent.com/EAS-Project/op8/lineage-20/drivers/cpufreq/electroutil.c"
        fi

        # Copy dan patch jika diperlukan
        cp -r "$KERNEL_PATCHES/performance/"* "$KERNEL_ROOT/common/drivers/cpufreq/" 2>/dev/null || true

    - name: Add Kernel Compression Support
      if: true
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        # Support untuk berbagai algoritma kompresi kernel
        echo "CONFIG_KERNEL_GZIP=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_KERNEL_LZ4=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_KERNEL_LZO=y" >> "${{ env.DEFCONFIG }}"
