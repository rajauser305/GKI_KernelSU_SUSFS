        echo "CONFIG_MODULE_COMPRESS_ZSTD=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_MODULE_COMPRESS_ZSTD_LEVEL=3" >> "${{ env.DEFCONFIG }}"

    - name: Add Kernel Debugging and Profiling (Optional)
      if: false  
