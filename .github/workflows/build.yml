    - name: Build Kernel
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
       KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
       KBUILD_BUILD_USER: ${{ env.KBUILD_BUILD_USER }}
       KBUILD_BUILD_HOST: ${{ env.KBUILD_BUILD_HOST }}
       # Tambahkan juga untuk kernel build system
       KERNEL_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
       KERNEL_BUILD_USER: ${{ env.KBUILD_BUILD_USER }}
       KERNEL_BUILD_HOST: ${{ env.KBUILD_BUILD_HOST }}
      run: |
        set -ex
    
        # Debug: Tampilkan environment variables
        echo "=== BUILD ENVIRONMENT VARIABLES ==="
        echo "KBUILD_BUILD_TIMESTAMP: $KBUILD_BUILD_TIMESTAMP"
        echo "KBUILD_BUILD_USER: $KBUILD_BUILD_USER"
        echo "KBUILD_BUILD_HOST: $KBUILD_BUILD_HOST"
        echo "KERNEL_BUILD_TIMESTAMP: $KERNEL_BUILD_TIMESTAMP"
        echo "KERNEL_BUILD_USER: $KERNEL_BUILD_USER"
        echo "KERNEL_BUILD_HOST: $KERNEL_BUILD_HOST"
        echo "================================"
    
        # Export ulang untuk memastikan tersedia di subprocess
        export KBUILD_BUILD_TIMESTAMP="$KBUILD_BUILD_TIMESTAMP"
        export KBUILD_BUILD_USER="$KBUILD_BUILD_USER"
        export KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST"
    
        # Tampilkan informasi sebelum build
        echo "Starting kernel build..."
        echo "Build time: $(date)"
        echo "Using timestamp: $KBUILD_BUILD_TIMESTAMP"
        echo "Built by: $KBUILD_BUILD_USER@$KBUILD_BUILD_HOST"
    
        if [ -f "build/build.sh" ]; then
        echo "Using build.sh method..."
        # Export environment untuk build script
        export SOURCE_DATE_EPOCH=$(date +%s)
      
        # Build dengan environment variables
        LTO=thin \
        BUILD_CONFIG=common/build.config.gki.aarch64 \
        KBUILD_BUILD_TIMESTAMP="$KBUILD_BUILD_TIMESTAMP" \
        KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
        KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
        build/build.sh || exit 1
      
        else
        echo "Using Bazel build method..."
      
        # Untuk Bazel, kita perlu set environment di command line
        if [[ "${{ inputs.android_version }}" == "android14" ]]; then
        # Build dengan lto=thin dan environment variables
        KBUILD_BUILD_TIMESTAMP="$KBUILD_BUILD_TIMESTAMP" \
        KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
        KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
        tools/bazel build --config=fast --lto=thin //common:kernel_aarch64_dist || exit 1
        else
        # Build dengan lto=none dan environment variables
        KBUILD_BUILD_TIMESTAMP="$KBUILD_BUILD_TIMESTAMP" \
        KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
        KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
        tools/bazel build --config=fast --lto=none //common:kernel_aarch64_dist || exit 1
        fi
        fi
    
        echo "Kernel build completed successfully!"
        echo "Build finished at: $(date)"

    - name: Prepare AnyKernel3 Zip
      run: |
        # Copy Image from normal build locations
        if [ -f "$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image" ]; then
          cp "$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image" "$ANYKERNEL3/Image"
        elif [ -f "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" ]; then
          cp "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" "$ANYKERNEL3/Image"
        else
          echo "Error: Image file not found in any expected location"
          exit 1
        fi
    
    - name: Copy snd-aloop module
      if: ${{ inputs.variant == 'vTomsonek' }}
      run: |
        if [ "${{ inputs.variant }}" = "vTomsonek" ]; then
          sed -i 's|^do\.modules=.*|do.modules=1|' ./AnyKernel3/anykernel.sh
        fi

        mkdir -p AnyKernel3/modules/data/adb/lkm

        if [[ "${{ inputs.android_version }}" == "android12" || "${{ inputs.android_version }}" == "android13" ]]; then
          SRC_DIR="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
        else
          SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
        fi

        cp "$SRC_DIR/snd-aloop.ko" "$ANYKERNEL3/modules/data/adb/lkm/"
        cp "$SRC_DIR/g_audio.ko" "$ANYKERNEL3/modules/data/adb/lkm/"

    - name: Scan and collect patch rejects
      if: ${{ always() }}
      run: |
        set -e
        CONFIG_DIR="$KERNEL_ROOT"
        REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
        mkdir -p "$REJECTS_DIR"
        # Find all .rej files under the configuration directory
        mapfile -t REJS < <(find "$CONFIG_DIR" -type f -name '*.rej')
        REJ_COUNT=${#REJS[@]}
        echo "Found $REJ_COUNT .rej files under $CONFIG_DIR"
        echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
        if [ "$REJ_COUNT" -gt 0 ]; then
          for REJ in "${REJS[@]}"; do
            # Relative path from $CONFIG
            REL="${REJ#"$CONFIG_DIR"/}"
            DEST="$REJECTS_DIR/$REL"
            mkdir -p "$(dirname "$DEST")"
            cp "$REJ" "$DEST"
            # Copy the associated original file alongside the .rej
            ORIG="${REJ%.rej}"
            if [ -f "$ORIG" ]; then
              ORIG_DEST="$REJECTS_DIR/${REL%.rej}"
              mkdir -p "$(dirname "$ORIG_DEST")"
              cp "$ORIG" "$ORIG_DEST"
            fi
            echo "$REL" >> "$REJECTS_DIR/index.txt"
          done
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FILE_NAME }}-AnyKernel3
        path: ./AnyKernel3/**
        if-no-files-found: ignore
        compression-level: 9

    - name: Upload Rejects
      if: ${{ always() && matrix.build_type != 'Bypass' && env.REJ_COUNT > 0 }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FILE_NAME }}-Rejects
        path: patch-rejects/
        if-no-files-found: ignore
        compression-level: 9
