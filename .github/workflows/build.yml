      run: |
        # ZRAM dengan algoritma kompresi modern
        echo "CONFIG_ZRAM=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_ZRAM_DEF_COMP_LZ4=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_ZRAM_WRITEBACK=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_ZRAM_MEMORY_TRACKING=y" >> "${{ env.DEFCONFIG }}"
    
        # ZSWAP untuk caching yang lebih efisien
        echo "CONFIG_ZSWAP=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_ZSWAP_COMPRESSOR_DEFAULT_LZ4=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_ZSWAP_COMPRESSOR_DEFAULT_ZSTD=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_ZSWAP_ZPOOL_DEFAULT_ZBUD=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_ZSWAP_ZPOOL_DEFAULT_Z3FOLD=y" >> "${{ env.DEFCONFIG }}"

    - name: Add TCP Congestion Control Algorithms
      if: true
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
       # Berbagai algoritma TCP congestion control
       echo "CONFIG_TCP_CONG_BBR=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_BBR2=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_WESTWOOD=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_HTCP=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_HYBLA=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_VEGAS=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_NV=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_SCALABLE=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_LP=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_VENO=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_YEAH=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_TCP_CONG_ILLINOIS=y" >> "${{ env.DEFCONFIG }}"
    
    - name: Add Filesystem optimizations
      if: true
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
       # Filesystem optimizations
       echo "CONFIG_F2FS_FS=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_F2FS_FS_SECURITY=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_F2FS_FS_ENCRYPTION=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_F2FS_FS_COMPRESSION=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_F2FS_STAT_FS=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_F2FS_FAULT_INJECTION=y" >> "${{ env.DEFCONFIG }}"
    
       # exFAT support
       echo "CONFIG_EXFAT_FS=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_EXFAT_DEFAULT_IOCHARSET=utf8" >> "${{ env.DEFCONFIG }}"
    
       # NTFS read/write support
       echo "CONFIG_NTFS_FS=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_NTFS_RW=y" >> "${{ env.DEFCONFIG }}"
    
    - name: Add CPU Frequency scaling optimizations
      if: true
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
       # CPU Freq optimizations
       echo "CONFIG_CPU_FREQ_STAT_DETAILS=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_POWERSAVE=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_USERSPACE=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_ONDEMAND=y" >> "${{ env.DEFCONFIG }}"
       echo "CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y" >> "${{ env.DEFCONFIG }}"
    
    - name: Add Performance Scheduler Tweaks
      if: true
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        # Scheduler optimizations
        echo "CONFIG_SCHED_TUNE=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_ENERGY_MODEL=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> "${{ env.DEFCONFIG }}"

        # HMP scheduler (untuk big.LITTLE)
        echo "CONFIG_SCHED_HMP=y" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_HMP_FAST_CPU_MASK=0" >> "${{ env.DEFCONFIG }}"
        echo "CONFIG_HMP_SLOW_CPU_MASK=0" >> "${{ env.DEFCONFIG }}"
